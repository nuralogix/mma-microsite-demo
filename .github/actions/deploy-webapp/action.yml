name: Deploy webapp to S3
description: 'Upload built webapp to S3 using static credentials and role assumption'

inputs:
  aws-access-key-id:
    description: 'AWS Access Key ID'
    required: true
  aws-secret-access-key:
    description: 'AWS Secret Access Key'
    required: true
  aws-region:
    description: 'AWS Region'
    required: true
  aws-role:
    description: 'AWS Role ARN to assume'
    required: true
  s3-bucket:
    description: 'S3 destination (e.g. s3://bucket/prefix/)'
    required: true
  cloudfront-distribution-id:
    description: 'CloudFront Distribution ID to invalidate'
    required: true
  cloudfront-path:
    description: 'CloudFront path pattern to invalidate'
    required: false
    default: '/*'

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
        role-to-assume: ${{ inputs.aws-role }}
        role-skip-session-tagging: true

    - name: Dry run - preview S3 changes
      run: |
        echo "=== DRY RUN: changes that would be applied to ${{ inputs.s3-bucket }} ==="
        aws s3 sync . ${{ inputs.s3-bucket }} --dryrun \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude ".vscode/*" \
          --exclude ".DS_Store" \
          --exclude "README.md"
      shell: bash

    - name: Upload to S3
      run: |
        aws s3 sync . ${{ inputs.s3-bucket }} \
          --exclude ".git/*" \
          --exclude ".github/*" \
          --exclude ".vscode/*" \
          --exclude ".DS_Store" \
          --exclude "README.md"
      shell: bash

